#!/bin/bash
INPUT_FILES='ORCA2_ICE_v5.0.0.tar.gz SAS_v5.0.0.tar.gz' 
# '' for no input files

EXPNAME="ORCA2_SAS_ICE"

# Compilation set up
# define compilation components
COMPONENTS="OCE ICE NST SAS"

# update cpp key list
ADD_KEYS_LOC="${ADD_KEYS/key_qco/}"

# REF set up
# Length of the REF simulation (ie LONG)
# if AGRIF do "XXXX YYYY ZZZZ" each number being AGRIF zoom level
REF_NIT000=1
REF_NITEND=256
REFDBG_ITEND=16
REF_JPNI=4
REF_JPNJ=8
REF_NPROC=32

# manage debug length
[[ "${USING_DEBUG}" == "yes" ]] && REF_NITEND=${REFDBG_ITEND}

# RST set up
RST_COMP="OCE ICE"
RST_NIT000=$((REF_NITEND/2))
RST_NITEND=${REF_NITEND}
RST_JPNI=${REF_JPNI}
RST_JPNJ=${REF_JPNJ}
RST_NPROC=32

# Length of the MPP simulation
MPP_NIT000=1
MPP_NITEND=${REF_NITEND}
MPP_JPNI=8
MPP_JPNJ=4
MPP_NPROC=32

# set physical parameter
set_physical_namelist() {
    echo 'No sette specific physical parameters defined'
}

